services:
  - type: web
    name: athenaos-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.new_main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: GEMINI_API_KEY
        sync: false
